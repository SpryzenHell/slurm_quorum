name: slurm-quorum-tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sqo-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./sqo_orchestrator[test,aws]"
      - run: sqo --help
      - run: PYTHONPATH=. python -m pytest -q
      - run: PYTHONPATH=. python -m py_compile sqo_orchestrator/*.py scripts/*.py
      - run: for f in scripts/benchmark_60k.sh scripts/check_3node_local.sh scripts/demo_compose.sh scripts/demo_local.sh scripts/quickstart.sh scripts/run_failover_demo.sh scripts/start_3node_local.sh; do bash -n "$f"; done
      - run: docker compose -f deploy/docker-compose.sqo.yml config -q
      - run: PYTHONPATH=. python -m sqo_orchestrator failover --root .sqo/ci-failover
      - run: PYTHONPATH=. python -m sqo_orchestrator load --jobs 10000 --workers 4 --root .sqo/ci-load
      - run: bash scripts/check_3node_local.sh .sqo/ci-network
