name: sqo-live-s3-smoke

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: 'S3 bucket used only for the smoke test'
        required: true
        type: string
      region:
        description: 'AWS region'
        required: true
        default: 'us-east-1'
        type: string
      endpoint_url:
        description: 'Optional S3-compatible endpoint (leave blank for AWS)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  s3-smoke:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SQO_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SQO_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.SQO_AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: S3 mutex race
        env:
          SQO_S3_ENDPOINT_URL: ${{ inputs.endpoint_url }}
          SQO_S3_REGION: ${{ inputs.region }}
        run: PYTHONPATH=. python scripts/check_s3_mutex.py --bucket '${{ inputs.bucket }}' --region '${{ inputs.region }}'
