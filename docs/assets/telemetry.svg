<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">SQO telemetry durability flow</title>
<desc id="d">SQLite event rows feed a replicator, which appends to a sink, flushes it, and only then advances a persistent cursor.</desc>
<rect width="1200" height="360" fill="#f7f7f5"/>
<style>text{font-family:Arial,sans-serif;fill:#202020}.box{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:24px;font-weight:600}.small{font-size:17px}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#555;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#333"/></marker></defs>
<text x="45" y="45" font-size="32" font-weight="700">Telemetry durability flow</text>
<rect class="box" x="45" y="105" width="210" height="95" rx="4"/><text class="label" x="150" y="145" text-anchor="middle">SQLite events</text><text class="small" x="150" y="173" text-anchor="middle">sequence + payload</text>
<rect class="box" x="350" y="105" width="220" height="95" rx="4"/><text class="label" x="460" y="145" text-anchor="middle">Replicator</text><text class="small" x="460" y="173" text-anchor="middle">reads after cursor</text>
<rect class="box" x="665" y="105" width="190" height="95" rx="4"/><text class="label" x="760" y="145" text-anchor="middle">Sink</text><text class="small" x="760" y="173" text-anchor="middle">append + flush</text>
<rect class="box" x="950" y="105" width="205" height="95" rx="4"/><text class="label" x="1052" y="145" text-anchor="middle">S3 / MinIO</text><text class="small" x="1052" y="173" text-anchor="middle">immutable segment</text>
<path class="line" d="M255 152 H350"/><path class="line" d="M570 152 H665"/><path class="line" d="M855 152 H950"/>
<rect class="box" x="435" y="260" width="300" height="55" rx="4"/><text class="small" x="585" y="295" text-anchor="middle">Only after flush → persist telemetry.cursor</text>
<path class="dash" d="M460 200 V260"/><path class="dash" d="M585 315 C585 335 250 335 250 200"/>
</svg>