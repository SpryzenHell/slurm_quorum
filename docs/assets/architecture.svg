<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Slurm-Quorum Orchestrator architecture</title>
<desc id="d">Implemented application layers: submitter, Redis admission queue, distributed agents, local SQLite WAL, Slurm, quorum nodes, S3 fencing and telemetry.</desc>
<rect width="1200" height="720" fill="#f7f7f5"/>
<style>
text{font-family:Arial,sans-serif;fill:#202020}
.box{fill:#fff;stroke:#222;stroke-width:2}
.label{font-size:24px;font-weight:600}
.small{font-size:18px}
.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}
.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="50" y="55" font-size="34" font-weight="700">Slurm-Quorum Orchestrator</text>
<text x="50" y="88" class="small">Data flow and control-plane boundaries used by the implementation</text>

<rect class="box" x="55" y="135" width="180" height="85" rx="4"/><text class="label" x="145" y="172" text-anchor="middle">Job</text><text class="small" x="145" y="200" text-anchor="middle">submitter</text>
<rect class="box" x="310" y="135" width="220" height="85" rx="4"/><text class="label" x="420" y="172" text-anchor="middle">Redis / Valkey</text><text class="small" x="420" y="200" text-anchor="middle">ready + claim lease</text>
<rect class="box" x="600" y="110" width="230" height="135" rx="4"/><text class="label" x="715" y="151" text-anchor="middle">SQO agents</text><text class="small" x="715" y="180" text-anchor="middle">Redis claim</text><text class="small" x="715" y="207" text-anchor="middle">→ SQLite → Slurm</text>
<rect class="box" x="900" y="135" width="220" height="85" rx="4"/><text class="label" x="1010" y="172" text-anchor="middle">Slurm</text><text class="small" x="1010" y="200" text-anchor="middle">sbatch / squeue / sacct</text>
<path class="line" d="M235 177 H310"/><path class="line" d="M530 177 H600"/><path class="line" d="M830 177 H900"/>

<rect class="box" x="600" y="330" width="230" height="105" rx="4"/><text class="label" x="715" y="370" text-anchor="middle">SQLite WAL</text><text class="small" x="715" y="399" text-anchor="middle">state + ownership</text><text class="small" x="715" y="422" text-anchor="middle">+ event journal</text>
<path class="line" d="M715 245 V330"/>

<rect class="box" x="900" y="330" width="220" height="105" rx="4"/><text class="label" x="1010" y="370" text-anchor="middle">Telemetry</text><text class="small" x="1010" y="399" text-anchor="middle">gzip JSONL segments</text><text class="small" x="1010" y="422" text-anchor="middle">S3 / MinIO</text>
<path class="line" d="M830 382 H900"/>

<rect class="box" x="55" y="330" width="220" height="105" rx="4"/><text class="label" x="165" y="370" text-anchor="middle">Quorum node 1</text><text class="small" x="165" y="399" text-anchor="middle">leader / follower</text><text class="small" x="165" y="422" text-anchor="middle">term + vote in SQLite</text>
<rect class="box" x="310" y="330" width="220" height="105" rx="4"/><text class="label" x="420" y="370" text-anchor="middle">Quorum node 2</text><text class="small" x="420" y="399" text-anchor="middle">leader / follower</text><text class="small" x="420" y="422" text-anchor="middle">term + vote in SQLite</text>
<rect class="box" x="55" y="485" width="220" height="105" rx="4"/><text class="label" x="165" y="525" text-anchor="middle">Quorum node 3</text><text class="small" x="165" y="554" text-anchor="middle">leader / follower</text><text class="small" x="165" y="577" text-anchor="middle">term + vote in SQLite</text>
<path class="dash" d="M275 382 H310"/><path class="dash" d="M420 435 V485 H275"/><path class="dash" d="M165 435 V485"/>
<rect class="box" x="310" y="500" width="220" height="75" rx="4"/><text class="label" x="420" y="531" text-anchor="middle">S3 master lease</text><text class="small" x="420" y="558" text-anchor="middle">conditional create / ETag</text>
<path class="dash" d="M310 537 H275"/>
<text x="600" y="500" class="small">Control-plane rule:</text>
<text x="600" y="528" class="small">majority election + fencing</text>
<text x="600" y="556" class="small">are separate from Redis admission.</text>
<text x="600" y="584" class="small">The project does not implement a full Raft log.</text>
</svg>