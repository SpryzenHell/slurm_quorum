<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">SQO job lifecycle</title>
<desc id="d">Implemented state transitions from queued to running and terminal or retry states, with Slurm status attached while running.</desc>
<rect width="1200" height="330" fill="#f7f7f5"/>
<style>
text{font-family:Arial,sans-serif;fill:#202020}.box{fill:#fff;stroke:#222;stroke-width:2}.label{font-size:25px;font-weight:600}.small{font-size:18px}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}.retry{stroke:#555;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="45" y="48" font-size="32" font-weight="700">Job lifecycle</text>
<rect class="box" x="45" y="110" width="180" height="75" rx="4"/><text class="label" x="135" y="157" text-anchor="middle">queued</text>
<rect class="box" x="330" y="110" width="180" height="75" rx="4"/><text class="label" x="420" y="157" text-anchor="middle">running</text>
<rect class="box" x="615" y="65" width="190" height="75" rx="4"/><text class="label" x="710" y="112" text-anchor="middle">succeeded</text>
<rect class="box" x="615" y="195" width="190" height="75" rx="4"/><text class="label" x="710" y="242" text-anchor="middle">failed</text>
<rect class="box" x="945" y="195" width="190" height="75" rx="4"/><text class="label" x="1040" y="242" text-anchor="middle">retry</text>
<path class="line" d="M225 147 H330"/><path class="line" d="M510 140 L615 103"/><path class="line" d="M510 170 L615 232"/><path class="line" d="M805 232 H945"/><path class="retry" d="M1040 195 C1040 150 940 125 830 125"/>
<text class="small" x="330" y="225">Slurm scheduler_id +</text><text class="small" x="330" y="250">last state are stored here</text>
<text class="small" x="945" y="290" text-anchor="middle">next attempt gets a new deterministic attempt identity</text>
</svg>