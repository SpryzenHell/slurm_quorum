services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  localstack:
    image: localstack/localstack:2026.08.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  s3-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sqo
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - python
      - -c
      - |
        import boto3
        import time

        client = boto3.client(
            "s3",
            endpoint_url="http://localstack:4566",
            region_name="us-east-1",
        )
        last = None
        for _ in range(60):
            try:
                client.create_bucket(Bucket="sqo")
                break
            except client.exceptions.BucketAlreadyOwnedByYou:
                break
            except Exception as exc:
                last = exc
                time.sleep(1)
        else:
            raise SystemExit(f"S3 bucket initialization failed: {last}")

  sqo-agent:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sqo
    depends_on:
      redis:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - python
      - /app/scripts/run_slurm_agent.py
      - --redis-url
      - redis://redis:6379/0
      - --queue
      - gpu
      - --namespace
      - sqo
      - --root
      - /data
      - --worker-id
      - sqo-agent-1
      - --partition
      - dgx
      - --interval
      - "1"
      - --lease-s
      - "8"
      - --s3-bucket
      - sqo
      - --s3-prefix
      - slurm-quorum
      - --s3-telemetry-prefix
      - slurm-quorum/telemetry
      - --s3-endpoint-url
      - http://localstack:4566
      - --s3-region
      - us-east-1
      - --s3-force-path-style
      - --dry-run
    volumes:
      - sqo-agent:/data

  sqo-node-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sqo
    restart: unless-stopped
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      SQO_NODE_ID: node-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - python
      - -m
      - sqo_orchestrator
      - serve
      - --root
      - /data
      - --bind
      - 0.0.0.0:8101
      - --peers
      - '{"node-2":"http://sqo-node-2:8102","node-3":"http://sqo-node-3:8103"}'
      - --s3-bucket
      - sqo
      - --s3-prefix
      - slurm-quorum
      - --s3-endpoint-url
      - http://localstack:4566
      - --s3-region
      - us-east-1
      - --s3-force-path-style
    ports:
      - "8101:8101"
    volumes:
      - sqo-node-1:/data

  sqo-node-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sqo
    restart: unless-stopped
    depends_on:
      - s3-init
    environment:
      SQO_NODE_ID: node-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - python
      - -m
      - sqo_orchestrator
      - serve
      - --root
      - /data
      - --bind
      - 0.0.0.0:8102
      - --peers
      - '{"node-1":"http://sqo-node-1:8101","node-3":"http://sqo-node-3:8103"}'
      - --s3-bucket
      - sqo
      - --s3-prefix
      - slurm-quorum
      - --s3-endpoint-url
      - http://localstack:4566
      - --s3-region
      - us-east-1
      - --s3-force-path-style
    ports:
      - "8102:8102"
    volumes:
      - sqo-node-2:/data

  sqo-node-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sqo
    restart: unless-stopped
    depends_on:
      - s3-init
    environment:
      SQO_NODE_ID: node-3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command:
      - python
      - -m
      - sqo_orchestrator
      - serve
      - --root
      - /data
      - --bind
      - 0.0.0.0:8103
      - --peers
      - '{"node-1":"http://sqo-node-1:8101","node-2":"http://sqo-node-2:8102"}'
      - --s3-bucket
      - sqo
      - --s3-prefix
      - slurm-quorum
      - --s3-endpoint-url
      - http://localstack:4566
      - --s3-region
      - us-east-1
      - --s3-force-path-style
    ports:
      - "8103:8103"
    volumes:
      - sqo-node-3:/data

volumes:
  redis-data:
  localstack-data:
  sqo-node-1:
  sqo-node-2:
  sqo-node-3:
  sqo-agent:
