[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-quorum-orchestrator"
version = "0.2.0"
description = "Distributed HPC control plane with Redis claims, SQLite WAL, quorum election, S3 fencing, and Slurm lifecycle tracking."
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
test = ["pytest>=8", "fakeredis>=2.26"]

[tool.setuptools]
packages = ["sqo_orchestrator"]
